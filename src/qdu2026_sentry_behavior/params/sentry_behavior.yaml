qdu2026_sentry_behavior_server:
  ros__parameters:
    use_sim_time: false
    action_name: qdu2026_sentry_behavior         # Optional
    tick_frequency: 10                           # 降低到 10 Hz，避免卡顿
    groot2_port: 1667                           # Optional (defaults to 1667)
    ros_plugins_timeout: 1000                   # Optional (defaults 1000 ms)
    use_cout_logger: false                      # Optional (defaults to false)

    plugins:
      - qdu2026_sentry_behavior/bt_plugins

    behavior_trees:
      - qdu2026_sentry_behavior/behavior_trees
   


    CalculateAttackPose:
      attack_radius: 2.0                        # 攻击半径（米）
      num_sectors: 36                           # 扇区划分数量
      cost_threshold: 50                        # 栅格的占用概率，大于该值将被视为障碍物 [0, 100]
      robot_base_frame: chassis
      visualize: true

qdu2026_sentry_behavior_client:
  ros__parameters:
    use_sim_time: false
    # target_tree: rmul_2025/rmul_2026
    target_tree: patrol
    

